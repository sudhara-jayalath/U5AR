<title>U5 Arenen Pflanzplaner</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="pp-style">
/* Layout: drawing sheet — title block on top, input legend rail left, section drawing + schedules right */
:root {
  --bg: #eef1ec; --paper: #fafbf8; --ink: #1c2a21; --muted: #5a6a60; --line: #d3dbd1;
  --moss: #2e6a44; --moss-2: #5f9a6f; --moss-soft: #dfece2; --water: #2b66a6; --water-soft: #d8e6f4;
  --soil: #8a6844; --soil-soft: #eee4d6; --pave: #c9cfc7;
  --ok: #2c7a4b; --ok-soft: #dff0e5; --warn: #a96f12; --warn-soft: #faefd9; --bad: #b23a3a; --bad-soft: #f7e0e0;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --paper: #18201a; --ink: #e1eae3; --muted: #98a89d; --line: #2c3a30;
    --moss: #7cc596; --moss-2: #4f8d62; --moss-soft: #1e3326; --water: #82b4e8; --water-soft: #172a3e;
    --soil: #caa47a; --soil-soft: #2b2419; --pave: #3a443c;
    --ok: #6fc68f; --ok-soft: #1b3324; --warn: #e2b25a; --warn-soft: #33281a; --bad: #ee8282; --bad-soft: #3a1f1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --paper: #18201a; --ink: #e1eae3; --muted: #98a89d; --line: #2c3a30;
  --moss: #7cc596; --moss-2: #4f8d62; --moss-soft: #1e3326; --water: #82b4e8; --water-soft: #172a3e;
  --soil: #caa47a; --soil-soft: #2b2419; --pave: #3a443c;
  --ok: #6fc68f; --ok-soft: #1b3324; --warn: #e2b25a; --warn-soft: #33281a; --bad: #ee8282; --bad-soft: #3a1f1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1340px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font: 600 11.5px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* title block */
.tb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.tb-left { display: grid; gap: 6px; min-width: 0; }
.tb-left p { max-width: 62ch; color: var(--muted); }
.tb-right { display: grid; gap: 8px; justify-items: end; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.status { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.status.dirty { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.status.clean { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.status.ro { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); color: var(--muted); padding: 5px 10px; font: 600 12.5px var(--f-mono); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { font: 600 13px var(--f-body); padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--moss); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--paper); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
.panel { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 12px; display: grid; gap: 8px; }
.panel textarea { width: 100%; min-height: 120px; font: 12px var(--f-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 8px 0 10px; font: 600 15px var(--f-body); color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: grid; text-align: left; }
.tabs button small { font: 400 11.5px var(--f-mono); color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--moss); }

/* area */
.area-head { display: grid; gap: 6px; }
.area-head p { max-width: 75ch; color: var(--muted); }
.area-grid { display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .area-grid { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 12px; min-width: 0; }
.main { display: grid; gap: 16px; min-width: 0; }
fieldset { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 10px 12px 12px; margin: 0; display: grid; gap: 7px; min-width: 0; }
legend { font: 600 11.5px var(--f-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.fld { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 14px; }
.fld .in { display: inline-flex; align-items: center; gap: 5px; }
.fld em { font-style: normal; font: 12px var(--f-mono); color: var(--muted); min-width: 3.2em; }
input[type="number"], input[type="text"], select { font: 13.5px var(--f-mono); padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
input[type="number"] { width: 6.2em; text-align: right; }
input[type="text"] { width: 100%; font-family: var(--f-body); }
select { max-width: 100%; }
.fld.ex span:first-child::after { content: " · " attr(data-ex); color: var(--warn); font-size: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.calc { font: 12.5px var(--f-mono); color: var(--muted); display: grid; gap: 2px; border-top: 1px dashed var(--line); padding-top: 6px; }
.calc b { color: var(--ink); font-weight: 600; }

/* section drawing */
figure.sec { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 8px; }
figure.sec figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.svgwrap { overflow-x: auto; }
.svgwrap svg { display: block; width: 100%; min-width: 560px; height: auto; }
.s-ground { fill: var(--soil-soft); }
.s-pave { fill: var(--pave); }
.s-gw { stroke: var(--water); stroke-width: 1.6; stroke-dasharray: 7 4; fill: none; }
.s-water { fill: var(--water-soft); }
.s-gline { stroke: var(--ink); stroke-width: 1.2; }
.s-shrub { fill: var(--moss); fill-opacity: 0.9; }
.s-shrub2 { fill: var(--moss-2); fill-opacity: 0.9; }
.s-low { fill: var(--moss-soft); stroke: var(--moss); stroke-width: 1; }
.s-ghost { stroke: var(--moss); stroke-dasharray: 3 3; fill: none; stroke-width: 1.2; }
.s-roof { fill: var(--ink); }
.s-col { stroke: var(--ink); stroke-width: 2; }
.s-person { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.s-txt { fill: var(--muted); font: 11px var(--f-mono); }
.s-txt-ink { fill: var(--ink); font: 600 11px var(--f-mono); }
.s-ok { stroke: var(--ok); stroke-width: 1.8; fill: none; }
.s-bad { stroke: var(--bad); stroke-width: 1.8; fill: none; }
.s-thin { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
.s-pit { fill: var(--soil-soft); stroke: var(--soil); stroke-width: 1.2; }
.s-pit-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.6; }
.s-ext { fill: var(--soil-soft); stroke: var(--soil); stroke-width: 0.8; stroke-dasharray: 3 2; }
.s-crown { fill: var(--moss); fill-opacity: 0.45; stroke: var(--moss); stroke-width: 1; }
.s-trunk { stroke: var(--soil); stroke-width: 3; }
.s-trunk-bad { stroke: var(--bad); stroke-width: 3; }
.s-grate { stroke: var(--ink); stroke-width: 3; }
.s-w { fill: var(--warn-soft); }
.s-road { fill: var(--pave); }
.s-rail { fill: var(--ink); }
.s-bar { fill: var(--ink); }

/* chips & indicators */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.chip.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.chip.info { color: var(--water); border-color: var(--water); background: var(--water-soft); }
.inds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ind { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; display: grid; gap: 2px; }
.ind .k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ind .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.ind.ok .k::before { background: var(--ok); }
.ind.warn .k::before { background: var(--warn); }
.ind.bad .k::before { background: var(--bad); }
.ind .v { font: 600 1.25rem var(--f-mono); font-variant-numeric: tabular-nums; }
.ind .s { font-size: 12px; color: var(--muted); }
.qual { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.qual div { border-top: 2px solid var(--moss); padding-top: 6px; display: grid; gap: 3px; }
.qual h4 { margin: 0; font: 600 11.5px var(--f-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.qual p { font-size: 14px; }

/* schedules */
.block { display: grid; gap: 8px; min-width: 0; }
.block > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.tablewrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
table.sched { width: 100%; border-collapse: collapse; font-size: 14px; }
table.sched th { text-align: left; font: 600 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sched td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.sched tr:last-child td { border-bottom: 0; }
table.sched .num { text-align: right; white-space: nowrap; }
table.sched input[type="number"] { width: 5.4em; }
.bot { font-style: italic; }
.de { display: block; font-size: 12.5px; color: var(--muted); }
.x { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 4px; width: 26px; height: 26px; cursor: pointer; font-size: 15px; line-height: 1; }
.x:hover { color: var(--bad); border-color: var(--bad); }
.listtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.addrow { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.addrow select { max-width: 260px; }
.listsum { font: 12.5px var(--f-mono); color: var(--muted); }
.listsum.bad { color: var(--bad); }
details.custom { width: 100%; }
details.custom summary { cursor: pointer; font-size: 13px; color: var(--moss); }
details.custom .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding-top: 8px; align-items: end; }
details.custom label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.zone-title { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }

/* overview */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.card dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 0; font-size: 14px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.warnlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.warnlist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.foot a { color: var(--water); }
.foot ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
@media (max-width: 640px) {
  .tb { grid-template-columns: minmax(0, 1fr); }
  .tb-right { justify-items: start; }
  .actions { justify-content: flex-start; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

/* ---------------------------------------------------------------- groundwater heuristics */
function needFor(gw, kind) {
  if (gw == null || !isFinite(gw)) return null;
  const lim = kind === "tree" ? [1.0, 2.0] : [0.8, 1.5];
  if (gw < lim[0]) return { bad: [1], warn: [2] };
  if (gw < lim[1]) return { bad: [], warn: [1] };
  return { bad: [], warn: [] };
}
function fitOf(s, need) {
  if (!need) return "na";
  if (need.bad.indexOf(s.m) >= 0) return "bad";
  if (need.warn.indexOf(s.m) >= 0) return "warn";
  return "ok";
}
function eco(items) {
  const tot = sum(items.map(i => i.n));
  const share = f => (tot ? sum(items.filter(i => f(sp(i.id), i)).map(i => i.n)) / tot : 0);
  const live = items.filter(i => i.n > 0);
  return {
    tot: tot,
    native: share(s => s.o === "v" || s.o === "f"),
    bee: share(s => !!s.bee), bird: share(s => !!s.bird),
    ever: share(s => s.e === 1) + 0.5 * share(s => s.e === 0.5),
    fit: share((s, i) => i.fit !== "bad" && i.fit !== "warn"),
    toxic: new Set(live.filter(i => sp(i.id).t).map(i => i.id)).size,
    species: new Set(live.map(i => i.id)).size
  };
}

  // sight lines
  const yAt = x => S.eye + (R.Habs - S.eye) * x / R.d1;
  if (R.Habs > S.eye) g += ln(X(0), Y(S.eye), X(S.roofD), Y(Math.min(top, yAt(S.roofD))), "s-thin");
  g += ln(X(0), Y(S.eye), X(S.roofD), Y(S.roofH), R.visible ? "s-ok" : "s-bad");
  return svg(F, g, tx("Schnitt Mini-Stadtwaldgarten", "Section mini urban forest garden"));
}

/* section: Vorplatz */
function secVP(S, R) {
  let items = R.trees.filter(t => t.n > 0);
  if (!items.length) items = R.trees;
  const gap = 3, pave = 0.4;
  let x = 0;
  const pos = items.map(t => {
    const gs = Math.sqrt(Math.max(0, t.grate)), Sx = Math.sqrt(t.extA + gs * gs), w = Math.max(t.c, Sx, gs, 2);
    const p = { t, cx: x + w / 2, gs, Sx };
    x += w + gap;
    return p;
  });
  const xmin = -1.5, xmax = Math.max(4, x - gap + 1.5);
  const top = Math.max(5, ...items.map(t => t.h)) + 1.2;
  const bottom = -(Math.max(S.gw + 0.5, R.pit + 0.4, pave + S.ext + 0.4));
  const F = frame(xmin, xmax, bottom, top), X = F.X, Y = F.Y;
  let g = rect(X(xmin), Y(0), X(xmax) - X(xmin), Y(bottom) - Y(0), "s-ground");
  g += rect(X(xmin), Y(-(S.gw - S.clear)), X(xmax) - X(xmin), S.clear * F.s, "s-water");
  g += rect(X(xmin), Y(0), X(xmax) - X(xmin), pave * F.s, "s-pave");
  pos.forEach(p => {
    const { t, cx, gs, Sx } = p, s = sp(t.id);
    g += rect(X(cx - Sx / 2), Y(-pave), Sx * F.s, S.ext * F.s, "s-ext");
    g += rect(X(cx - gs / 2), Y(0), gs * F.s, R.pit * F.s, R.conflict ? "s-pit-bad" : "s-pit");
    g += ln(X(cx - gs / 2), Y(0), X(cx + gs / 2), Y(0), "s-grate");
    g += ln(X(cx), Y(0), X(cx), Y(S.cb + 0.5), "s-trunk");
    g += ell(X(cx), Y((S.cb + t.h) / 2), (t.c / 2) * F.s, ((t.h - S.cb) / 2) * F.s, "s-crown");
    g += txt(X(cx), Y(t.h) - 6, `${abbr(s.b)} ×${t.n}`, "s-txt-ink", "middle");
    g += txt(X(cx), Y(-pave - S.ext) + 13, `${nf(t.totV, 0)} m³`, "s-txt", "middle");
  });
  g += ln(X(xmin), Y(0), X(xmax), Y(0), "s-gline");
  g += ln(X(xmin), Y(-S.gw), X(xmax), Y(-S.gw), "s-gw") + txt(X(xmax) - 4, Y(-S.gw) + 13, `MHGW −${nf(S.gw, 2)} m`, "s-txt", "end");
  return svg(F, g, tx("Schnitt Vorplatz-Bäume", "Section plaza trees"));
}

/* section: Randbereich */
function secRB(S, R) {
  const road = 5, L = S.wSaum + S.wStrauch + S.wBaum, coreW = 14;
  const xmin = -road - 0.5, xmax = L + coreW + 0.5;
  const top = Math.max(S.hWK, 8) + 1.6, bottom = -(Math.max(S.gw, 1) + 0.8);
  const F = frame(xmin, xmax, bottom, top), X = F.X, Y = F.Y;
  let g = rect(X(xmin), Y(0), X(xmax) - X(xmin), Y(bottom) - Y(0), "s-ground");
  if (S.guard) g += rect(X(0), Y(top - 0.4), S.W * F.s, Y(0) - Y(top - 0.4), "s-w") + txt(X(S.W / 2), Y(top - 0.4) + 12, "W", "s-txt-ink", "middle");
  g += ln(X(R.crit), Y(top - 0.4), X(R.crit), Y(0), "s-thin") + txt(X(R.crit) + 3, Y(top - 0.4) + 26, tx(`krit. Abstand ${nf(R.crit, 1)} m`, `critical ${nf(R.crit, 1)} m`));
  g += rect(X(xmin), Y(0.1), X(-0.2) - X(xmin), 0.1 * F.s, "s-road") + txt(X(-road / 2), Y(0) + 14, tx("Fahrbahn", "road"), "s-txt", "middle");
  if (S.guard) { g += ln(X(-0.1), Y(0), X(-0.1), Y(0.75), "s-col") + rect(X(-0.35), Y(0.75), 0.5 * F.s, 0.3 * F.s, "s-rail"); }
  g += rect(X(0), Y(0.8), S.wSaum * F.s, 0.8 * F.s, "s-low");
  const nb = Math.max(2, Math.round(S.wStrauch / 1.3));
  for (let k = 0; k < nb; k++) {
    const h = S.hWM * (0.7 + 0.3 * ((k * 37) % 10) / 10);
    const cx = S.wSaum + (k + 0.5) * S.wStrauch / nb;
    g += ell(X(cx), Y(h / 2), (S.wStrauch / nb) * 0.62 * F.s, (h / 2) * F.s, k % 2 ? "s-shrub2" : "s-shrub");
  }
  const tree = (cx, h, rx) => {
    const bad = cx < R.limit - 1e-9;
    return ln(X(cx), Y(0), X(cx), Y(h * 0.45), bad ? "s-trunk-bad" : "s-trunk") + ell(X(cx), Y(h * 0.68), rx * F.s, h * 0.32 * F.s, "s-crown");
  };
  const hBM = Math.min(S.hWK * 0.7, 12);
  for (let cx = S.wSaum + S.wStrauch + 0.3; cx < L; cx += 2.5) g += tree(cx, hBM, 1.4);
  for (let cx = L + 1.5; cx < xmax - 1; cx += 3) g += tree(cx, S.hWK, 2.0);
  g += ln(X(xmin), Y(0), X(xmax), Y(0), "s-gline");
  g += ln(X(0), Y(-S.gw), X(xmax), Y(-S.gw), "s-gw") + txt(X(xmax) - 4, Y(-S.gw) + 13, `MHGW −${nf(S.gw, 2)} m`, "s-txt", "end");
  const lab = [[S.wSaum / 2, "Saum"], [S.wSaum + S.wStrauch / 2, tx("Strauchmantel", "shrub mantle")], [S.wSaum + S.wStrauch + S.wBaum / 2, tx("Baummantel", "tree mantle")], [L + coreW / 2, "Waldkern"]];
  lab.forEach(([x0, t]) => { g += txt(X(x0), Y(0) + 14, t, "s-txt", "middle"); });
  return svg(F, g, tx("Schnitt Randbereich", "Section verge"));
}

function flagChips(id, fit) {

function getRef(path) {
  const p = path.split(".");
  let o = state;
  for (let i = 0; i < p.length - 1; i++) { o = o[isFinite(p[i]) ? +p[i] : p[i]]; if (o == null) return null; }
  return { o, k: isFinite(p[p.length - 1]) ? +p[p.length - 1] : p[p.length - 1] };
}
function setFromInput(el) {
  const r = getRef(el.dataset.path);
  if (!r) return false;
  if (el.dataset.bool) r.o[r.k] = !!el.checked;
  else if (el.dataset.str) r.o[r.k] = el.value;
  else {
    const raw = String(el.value).replace(",", ".");
    if (raw === "" || !isFinite(+raw)) return false;
    let v = +raw;
    if (el.dataset.scale) v = v / +el.dataset.scale;
    r.o[r.k] = v;
  }
  return true;
}
function applyPreset(kind) {

  if (kind === "rbchar") {
    const p = RB_CHAR[state.rb.char];
    if (p) {
      const keep = state.rb.wk.filter(x => !(x.id in p.wk));
      const base = Object.keys(p.wk).map(id => { const old = state.rb.wk.find(x => x.id === id); return { id, s: p.wk[id], d: old ? old.d : (DEF_DENS[sp(id).l] || 5000) }; });
      keep.forEach(x => { x.s = 0; });

    }
  }
}

  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>" +
    "<title>U5 Arenen Pflanzplaner</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n" +
    "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap\">\n" +
    "<style id=\"pp-style\">" + styleEl.textContent + "</style>\n<div id=\"app\"></div>\n" +
    "<" + SC + " type=\"application/json\" id=\"saved-state\">" + json + "</" + SC + ">\n" +
    "<" + SC + " id=\"pp-app\">" + appEl.textContent + "</" + SC + ">\n</body></html>";
}
async function saveForAll() {
  if (!artifactNS || busy || readOnly) return;
  busy = true; statusMsg = tx("Speichert …", "Saving …"); renderStatus();
  const toSave = clone(state);
  toSave.meta.savedAt = new Date().toISOString();
  try {
    await artifactNS.publish(pageHTML(toSave));
    lsDel(STORE_DRAFT);
    statusMsg = tx("Gespeichert – die Seite lädt neu", "Saved – the page reloads");
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") statusMsg = tx("Eine neuere Version wird geladen. Ihr Entwurf bleibt in diesem Browser.", "A newer version is loading. Your draft stays in this browser.");
    else if (["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared"].indexOf(code) >= 0) { readOnly = true; statusMsg = ""; }
    else if (code === "rate_limited") statusMsg = tx("Zu viele Speichervorgänge. Bitte kurz warten.", "Too many saves. Please wait a moment.");
    else statusMsg = tx("Speichern ist fehlgeschlagen. Bitte erneut versuchen.", "Saving failed. Please try again.");
  }
  busy = false; renderStatus();
  if (statusMsg && !/neu|reload/i.test(statusMsg)) setTimeout(() => { statusMsg = ""; renderStatus(); }, 5000);
}

/* ---------------------------------------------------------------- events */
document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.path || el.dataset.rr != null || el.dataset.bool) return;
  if (el.tagName === "SELECT") return;
  if (setFromInput(el)) changed(false);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "file-import") { if (el.files && el.files[0]) onImport(el.files[0]); el.value = ""; return; }
  if (!el.dataset || !el.dataset.path) return;
  if (el.tagName === "SELECT" || el.dataset.bool || el.dataset.rr != null) {
    if (!setFromInput(el)) return;
    if (el.dataset.rr && el.dataset.rr !== "1") applyPreset(el.dataset.rr);
    changed(true);
  }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.lang) { LANG = t.dataset.lang; ui.lang = LANG; lsSet(STORE_UI, ui); render(); return; }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; lsSet(STORE_UI, ui); render(); window.scrollTo({ top: 0, behavior: "auto" }); return; }
  if (t.dataset.act) onAct(t);
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const i = TABS.indexOf(ui.tab), n = (i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
    ui.tab = TABS[n]; lsSet(STORE_UI, ui); render();
    const nb = document.querySelector(`[role="tab"][data-tab="${ui.tab}"]`); if (nb) nb.focus();
  }
});

render();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(ns => { artifactNS = ns; renderStatus(); }, () => {});
  window.claude.use("downloads").then(ns => { downloadsNS = ns; }, () => {});
}
})();
</script>
